<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 MindGarden 创意花园</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-container" id="app">

  <!-- 侧边导航 -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span>🌱</span>
      MindGarden
    </div>
    <button class="nav-tab active" data-view="nursery">
      <span class="nav-icon">🌿</span>
      <span class="nav-label">苗圃</span>
    </button>
    <button class="nav-tab" data-view="seedbox">
      <span class="nav-icon">🌰</span>
      <span class="nav-label">种子箱</span>
    </button>
    <button class="nav-tab" data-view="greenhouse">
      <span class="nav-icon">🌱</span>
      <span class="nav-label">思维温室</span>
    </button>
    <button class="nav-tab" data-view="harvest">
      <span class="nav-icon">🧺</span>
      <span class="nav-label">收获篮</span>
    </button>
    <button class="nav-tab" data-view="bouquet">
      <span class="nav-icon">💐</span>
      <span class="nav-label">花束</span>
    </button>
    <button class="nav-tab" data-view="gardenmap">
      <span class="nav-icon">🗺️</span>
      <span class="nav-label">花园地图</span>
    </button>
    <button class="nav-tab" data-view="calendar">
      <span class="nav-icon">📅</span>
      <span class="nav-label">手账日历</span>
    </button>
    <button class="nav-tab" data-view="settings">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">设置</span>
    </button>
  </nav>

  <!-- 主内容 -->
  <main class="main-content">
    <header class="top-bar">
      <div class="greeting" id="greeting"></div>
      <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
    </header>
    <div class="view-container" id="view-container">
      <!-- 由 JavaScript 渲染 -->
    </div>
  </main>
</div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-subtitle" id="modalSubtitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>

<script src="../js/main.js"></script>
</body>
</html>
