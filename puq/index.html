<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 MindGarden 创意花园</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-container" id="app">

  <!-- 侧边导航 -->
  <nav class="sidebar" id="sidebar" role="tablist" aria-label="视图切换">
    <div class="sidebar-logo">
      <span>🌱</span>
      MindGarden
    </div>
    <button class="nav-tab active" role="tab" aria-selected="true" data-view="nursery">
      <span class="nav-icon">🌿</span>
      <span class="nav-label">苗圃</span>
    </button>
    <button class="nav-tab" role="tab" aria-selected="false" data-view="seedbox">
      <span class="nav-icon">🌰</span>
      <span class="nav-label">种子箱</span>
    </button>
    <button class="nav-tab" role="tab" aria-selected="false" data-view="greenhouse">
      <span class="nav-icon">🌱</span>
      <span class="nav-label">思维温室</span>
    </button>
    <button class="nav-tab" role="tab" aria-selected="false" data-view="harvest">
      <span class="nav-icon">🧺</span>
      <span class="nav-label">收获篮</span>
    </button>
    <button class="nav-tab" role="tab" aria-selected="false" data-view="bouquet">
      <span class="nav-icon">💐</span>
      <span class="nav-label">花束</span>
    </button>
    <button class="nav-tab" role="tab" aria-selected="false" data-view="gardenmap">
      <span class="nav-icon">🗺️</span>
      <span class="nav-label">花园地图</span>
    </button>
    <button class="nav-tab" role="tab" aria-selected="false" data-view="calendar">
      <span class="nav-icon">📅</span>
      <span class="nav-label">手账日历</span>
    </button>
    <button class="nav-tab" role="tab" aria-selected="false" data-view="settings">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">设置</span>
    </button>
  </nav>

  <!-- 主内容 -->
  <main class="main-content" role="main" aria-label="主内容">
    <header class="top-bar">
      <div class="greeting" id="greeting"></div>
      <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换明暗主题">🌙</button>
    </header>
    <div class="view-container" id="view-container" role="region" aria-label="内容区域">
      <!-- 由 JavaScript 渲染 -->
    </div>
  </main>
</div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal-card" id="modalCard">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-subtitle" id="modalSubtitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/modal.js"></script>
<script src="../js/state.js"></script>
<script src="../js/render.js"></script>
<script src="../js/tools.js"></script>
<script src="../js/export.js"></script>
<script src="../js/events.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
